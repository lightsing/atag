name: ATAG tray packages

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: ATAG website URL opened by the tray
        required: true
        type: string
      runner:
        description: Platform to package
        type: choice
        default: all
        options: [all, macos-15, macos-15-intel, windows-2025, ubuntu-22.04]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.runner == 'all' && fromJSON('["macos-15","macos-15-intel","windows-2025","ubuntu-22.04"]') || fromJSON(format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/atag-agent-tray/package.mjs "$ATAG_TRAY_WEB_URL"
        shell: bash
        env:
          ATAG_TRAY_WEB_URL: ${{ inputs.web_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: ATAG-Agent-${{ matrix.os }}
          path: target/packages/ATAG-Agent-*
          if-no-files-found: error
