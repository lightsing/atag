[package]
name = "atag-bootloader-nrf52832"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-boot-nrf = { version = "=0.12.0", features = ["softdevice"] }
embassy-nrf = { version = "0.11.0", default-features = false, features = ["nrf52832", "rt"] }
embassy-sync = "0.8.0"

[[bin]]
name = "atag-bootloader-nrf52832"
path = "src/main.rs"
test = false
bench = false
