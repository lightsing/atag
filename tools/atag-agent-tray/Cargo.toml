[package]
name = "atag-agent-tray"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Desktop tray for the ATAG loopback agent"

[dependencies]
anyhow = "1"
atag-agent = { path = "../atag-agent" }
clap = { version = "4.5.60", features = ["derive", "env"] }
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = { version = "0.37.2", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
